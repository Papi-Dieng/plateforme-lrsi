# Vérifications lancées par GitHub à chaque push et à chaque pull request :
# lint, tests automatisés, compilation, site en ligne (docs/) à jour, puis
# tests dans un vrai navigateur (Playwright).
# Rien n'est publié ici : GitHub Pages sert toujours docs/ tel qu'il est
# versionné. Une croix rouge sur le commit signale ce qui a cassé.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests automatisés
        run: npm test

      - name: Compilation
        run: npm run build

      # Si le code a changé sans que `npm run build` ait été relancé avant
      # le commit, le site en ligne n'est pas à jour.
      - name: Site en ligne à jour (docs/)
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git status --short docs
            echo "::error::docs/ n'est pas à jour : lancer npm run build, puis commiter docs/."
            exit 1
          fi

      - name: Navigateur pour les tests (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Tests dans le navigateur
        run: npx playwright test

      # En cas d'échec : le rapport, avec captures et traces, se télécharge
      # depuis la page de l'exécution (rubrique « Artifacts »).
      - name: Rapport des tests dans le navigateur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 14
