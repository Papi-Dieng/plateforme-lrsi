    <title>Plateforme d'apprentissage LRSI</title>
    <meta
      name="description"
      content="Plateforme gratuite pour les étudiants en Réseaux et Systèmes Informatiques : cours, exercices corrigés, QCM en mode examen, vidéos d'explication et suivi de progression. Projet étudiant, sans objectif commercial."
    />
    <meta name="author" content="Projet étudiant LRSI" />

    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!-- Toutes les pages partagent cette adresse : le routeur à dièse
         garde la navigation après le « # », qui n'est jamais envoyé au
         serveur. L'adresse canonique est donc la racine du site. -->
    <link rel="canonical" href="https://papi-dieng.github.io/plateforme-lrsi/" />

    <!-- Couleur de la barre du navigateur, accordée aux deux thèmes. -->

      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d101a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Aperçu lors d'un partage de lien, sur WhatsApp, Facebook,
         LinkedIn ou X. Ces adresses doivent être absolues : un chemin
         relatif ne serait pas résolu par les robots qui lisent la page.
         Elles sont donc à corriger si le site change d'hébergement.
         L'image est générée depuis design/apercu-partage.svg. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Plateforme d'apprentissage LRSI" />
    <meta property="og:title" content="Plateforme d'apprentissage LRSI" />

    />
    <meta
      property="og:image"
      content="https://papi-dieng.github.io/plateforme-lrsi/apercu-partage.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cours, exercices corrigés et QCM de la filière LRSI — Réseaux et Systèmes Informatiques, entièrement gratuit."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"

  <body>
    <div id="root"></div>

    <!-- Sans JavaScript, la page resterait blanche sans explication. -->
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          line-height: 1.7;
          color: #232838;
        "
      >
        <h1 style="font-size: 1.5rem; margin-bottom: 0.75rem">
          JavaScript est désactivé
        </h1>
        <p>
          Cette plateforme a besoin de JavaScript pour afficher les cours, les
          exercices et les QCM. Active-le dans les réglages de ton navigateur,
          puis recharge la page.
        </p>
        <p style="color: #667085; font-size: 0.9rem">
          Aucune donnée n'est envoyée sur un serveur : la progression reste
          dans ton navigateur.
        </p>
      </div>
    </noscript>

    <!-- DEBUT AVERTISSEMENT FICHIER LOCAL -->
    <!-- Ouverte par double-clic, cette page reste blanche : le module
         JavaScript ci-dessous ne sera jamais charge. Plutot que de
         laisser quelqu'un devant un ecran vide sans explication, on le
         lui dit. Ce script est volontairement classique, et non un
         module, afin de s'executer dans tous les cas.

         La compilation hors ligne retire ce bloc : elle n'a rien a
         charger, elle fonctionne donc depuis un fichier local. -->
    <script>
      if (location.protocol === "file:") {
        document.getElementById("root").innerHTML = "<div style=\"max-width:36rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.7;color:#232838\"><h1 style=\"font-size:1.5rem;margin-bottom:.75rem\">Cette page ne peut pas s'ouvrir par double-clic</h1><p>Ce n'est pas une panne. Par sécurité, les navigateurs refusent de charger un module JavaScript depuis un fichier local. La page reste donc vide, quoi qu'il arrive.</p><p><strong>Pour voir le site, au choix :</strong></p><ul><li>ouvrir <code>hors-ligne/plateforme-lrsi-hors-ligne.html</code>, le fichier prévu exactement pour cet usage ;</li><li>lancer <code>npm run preview</code> dans le dossier du projet ;</li><li>aller sur <a href=\"https://papi-dieng.github.io/plateforme-lrsi/\">papi-dieng.github.io/plateforme-lrsi</a>.</li></ul><p style=\"color:#667085;font-size:.9rem\">Le fichier hors ligne se fabrique avec <code>npm run hors-ligne</code> s'il n'existe pas encore.</p></div>";
      }
    </script>
    <!-- FIN AVERTISSEMENT FICHIER LOCAL -->

  </body>
</html>
